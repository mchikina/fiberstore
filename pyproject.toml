[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fiberstore"
version = "0.1.0"
description = "Compact, region-queryable per-fiber store built from Fiber-seq BAMs"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Maria Chikina"}]
keywords = ["fiber-seq", "single-molecule", "m6a", "parquet", "chromatin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.21",
  "pyarrow>=12",
]

[project.optional-dependencies]
build = ["pysam>=0.21"]
test = ["pytest>=7", "pysam>=0.21"]

[project.scripts]
fiberstore = "fiberstore.cli:main"

[tool.setuptools]
packages = ["fiberstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
